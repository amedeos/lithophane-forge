# Prusament PETG colours with their measured hex code and transmission distance (TD, mm).
# Source: Prusa Research, "HueForge filament transparency values and hexcodes"
# https://help.prusa3d.com/article/hueforge-filament-transparency-values-and-hexcodes_762314
# (read on 2026-11-01). Prusa measured these values for HueForge; lithophane-forge uses TD
# as the thickness that lets about 10 % of the light through, which is an approximation.
# Rows without a TD on that page are left out.

source = "https://help.prusa3d.com/article/hueforge-filament-transparency-values-and-hexcodes_762314"
material = "petg"

[[filament]]
name = "Prusament PETG Signal White"
hex = "#E5E0E1"
td = 3.4

