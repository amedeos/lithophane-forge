# Prusament PETG colours with their measured hex code and transmission distance (TD, mm).
# Source: Prusa Research, "HueForge filament transparency values and hexcodes"
# https://help.prusa3d.com/article/hueforge-filament-transparency-values-and-hexcodes_762314
# (read on 2026-11-01). Prusa measured these values for HueForge; lithophane-forge uses TD
# as the thickness that lets about 10 % of the light through, which is an approximation.
# Rows without a TD on that page are left out.
#
# k (absorption per channel, red, green, blue) and s (scattering), both in 1/mm, are our own
# measurements, not Prusa's. They drive the light model of a picture in room light: hex and TD
# cannot describe a translucent coloured or nearly clear filament, so without k and s such
# filaments are left out in room light (--allow-unmeasured uses them). The values below are preliminary: fitted on
# 2026-11-02 from one phone photo of a print, to be replaced by a calibration print.

source = "https://help.prusa3d.com/article/hueforge-filament-transparency-values-and-hexcodes_762314"
material = "petg"

[[filament]]
name = "Prusament PETG Signal White"
hex = "#E5E0E1"
td = 3.4

[[filament]]
name = "Prusament PETG V0 Natural"
hex = "#DEE2D8"
td = 10.4

[[filament]]
name = "Prusament PETG Clear"
hex = "#E4E7E3"
td = 100.0

[[filament]]
name = "Prusament PETG Mango Yellow"
hex = "#F2B706"
td = 2.6

[[filament]]
name = "Prusament PETG Yellow Gold"
hex = "#9A8523"
td = 9.2
k = [0.220, 0.559, 11.9]  # preliminary, see the top of this file
s = 0.0127

