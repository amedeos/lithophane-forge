# Segmentation models for --focus subject (vision.py). Each one is downloaded on first use
# into the model folder (lithophane-forge models shows it) and checked against its SHA-256.
# The subject is the mean of the three maps: each model fails somewhere different (one loses
# a raised hand, one adds a rock that touches a hand, one adds a fence), and on the owner's
# photos the mean found the people on 10 of the 11 photos with people (2026-11-03). Without
# people they mark the main object (a plate of fruit); in an open landscape they mark
# nothing.
#
# The URLs are fixed: a Hugging Face commit, or rembg's release assets.
#
# input: the model's fixed input size (width, height), stretched as rembg does; or
# short_side: a dynamic input, the photo's short side at this size (the long side at most
# long_side), both sides a multiple of 32. scale: "max" divides by the largest value of the resized photo (as rembg does), a
# number divides by it. Then (x - mean) / std per channel (R, G, B). Every model returns a
# probability from 0 to 1 in its first output.

[models.u2net_human_seg]
title = "U2-Net, human segmentation"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx"
sha256 = "01eb6a29a5c4d8edb30b56adad9bb3a2a0535338e480724a213e0acfd2d1c73c"
size = 175997641
licence = "Apache-2.0 (the U-2-Net repository)"
source = "https://github.com/xuebinqin/U-2-Net"
input = [320, 320]
resample = "lanczos"
scale = "max"
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]

[models.modnet]
title = "MODNet, portrait matting"
url = "https://huggingface.co/Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model.onnx"
sha256 = "07c308cf0fc7e6e8b2065a12ed7fc07e1de8febb7dc7839d7b7f15dd66584df9"
size = 25888640
licence = "Apache-2.0"
source = "https://github.com/ZHKKKe/MODNet"
short_side = 512  # at 1024 it also marked a mountain peak
long_side = 1024  # a panorama: the long side at most this, the short side then smaller
resample = "bilinear"
scale = 255
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]

[models.isnet]
title = "IS-Net (DIS), general use"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx"
sha256 = "60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a"
size = 178648008
licence = "Apache-2.0 (the DIS repository)"
source = "https://github.com/xuebinqin/DIS"
input = [1024, 1024]
resample = "lanczos"
scale = "max"
mean = [0.5, 0.5, 0.5]
std = [1.0, 1.0, 1.0]
